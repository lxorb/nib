[package]
name = "nib-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Exposes a Nib space to an LLM over the Model Context Protocol."

[[bin]]
name = "nib-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
