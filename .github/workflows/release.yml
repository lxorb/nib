name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # No version here: it comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            services/mcp
          key: ${{ matrix.target }}

      - name: System dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - run: pnpm install --frozen-lockfile

      # The MCP connector ships inside the app, so the LLM settings panel has a
      # real binary to point at.
      - name: Build the MCP connector
        run: cargo build --release --manifest-path services/mcp/Cargo.toml --target ${{ matrix.target }}

      - name: Stage the connector
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "services/mcp/target/${{ matrix.target }}/release/nib-mcp.exe" apps/desktop/src-tauri/binaries/
          else
            cp "services/mcp/target/${{ matrix.target }}/release/nib-mcp" apps/desktop/src-tauri/binaries/
          fi

      - name: Build the app
        run: pnpm --filter @nib/desktop exec tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: nib-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
