name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No version here: it comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check

      - name: Tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri

      # Tauri needs the system webview to compile against.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # Tauri's build script embeds the built frontend, so it has to exist
      # before the crate will even compile.
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      - name: Format
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
